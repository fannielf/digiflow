<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiFlow</title>
  <meta name="description" content="DigiFlow hjälper små och medelstora företag och organisationer att navigera digitaliseringens möjligheter." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:    #111c22;
      --teal:   #1a6b6b;
      --teal2:  #145555;
      --pink:   #ef7575;
      --sand:   #f5f0ea;
      --foam:   #e8f4f4;
      --white:  #ffffff;
      --text:   #1e2e2e;
      --muted:  #5a6e6e;
      --border: #d8e8e8;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--white);
      font-size: 16px;
      line-height: 1.7;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(1.5rem, 5vw, 4rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .nav-logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      color: var(--teal);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .nav-logo span { color: var(--pink); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2rem;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--teal); }

    .nav-cta {
      background: var(--teal) !important;
      color: var(--white) !important;
      padding: 0.5rem 1.25rem;
      border-radius: 100px;
      font-weight: 600 !important;
      transition: background 0.2s !important;
    }

    .nav-cta:hover { background: var(--pink) !important; }

    /* Language switcher */
    .lang-switcher {
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }

    .lang-btn {
      background: none;
      border: 1.5px solid transparent;
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.04em;
    }

    .lang-btn:hover { color: var(--teal); }
    .lang-btn.active { color: var(--teal); border-color: var(--teal); }

    /* ── HERO ── */
    .hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      padding: clamp(4rem, 10vh, 8rem) clamp(1.5rem, 5vw, 4rem);
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, var(--sand) 0%, var(--foam) 60%, #d4ecec 100%);
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -15%;
      right: -5%;
      width: 45%;
      height: 80%;
      background: radial-gradient(ellipse at center, rgba(26,107,107,0.08) 0%, transparent 65%);
      pointer-events: none;
    }

    .hero-content { max-width: 680px; position: relative; z-index: 1; }

    .hero-badge {
      display: inline-block;
      background: rgba(26,107,107,0.1);
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 100px;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      line-height: 1.15;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    .hero h1 em { font-style: italic; color: var(--pink); }

    .hero p {
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      color: var(--muted);
      max-width: 560px;
      margin-bottom: 2.5rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-primary {
      background: var(--teal);
      color: var(--white);
      padding: 0.85rem 2rem;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s, transform 0.15s;
      display: inline-block;
    }

    .btn-primary:hover { background: var(--pink); transform: translateY(-1px); }

    .btn-secondary {
      color: var(--teal);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: gap 0.2s;
    }

    .btn-secondary:hover { gap: 0.7rem; }
    .btn-secondary::after { content: '→'; }

    /* ── SECTION SHARED ── */
    section { padding: clamp(4rem, 8vw, 6rem) clamp(1.5rem, 5vw, 4rem); }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      line-height: 1.2;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .section-sub {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 560px;
      margin-bottom: 3rem;
    }

    /* ── SERVICES ── */
    .services { background: var(--white); }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
    }

    .service-card {
      background: var(--sand);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.25rem;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--teal), var(--pink));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .service-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(26,107,107,0.1); }
    .service-card:hover::before { opacity: 1; }

    .service-icon {
      width: 48px; height: 48px;
      background: var(--foam);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      font-size: 1.4rem;
    }

    .service-card h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      color: var(--ink);
      margin-bottom: 0.75rem;
    }

    .service-card p { color: var(--muted); font-size: 0.95rem; line-height: 1.65; }

    .service-list { list-style: none; margin-top: 1rem; }

    .service-list li {
      font-size: 0.9rem;
      color: var(--muted);
      padding: 0.3rem 0 0.3rem 1.2rem;
      position: relative;
    }

    .service-list li::before {
      content: '·';
      position: absolute;
      left: 0;
      color: var(--pink);
      font-weight: 700;
    }

    /* ── PRODUCTS ── */
    .products { background: var(--foam); }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      max-width: 1100px;
    }

    .product-card {
      background: var(--white);
      border: 1.5px dashed var(--border);
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 180px;
      transition: border-color 0.2s;
    }

    .product-card.filled { border-style: solid; }
    .product-card.filled:hover { border-color: var(--teal); box-shadow: 0 8px 24px rgba(26,107,107,0.08); }

    .product-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--teal);
      background: var(--foam);
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      width: fit-content;
    }

    .product-card h4 { font-weight: 600; font-size: 1rem; color: var(--ink); }
    .product-card p { font-size: 0.875rem; color: var(--muted); line-height: 1.55; }

    .product-card.placeholder {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .product-card.placeholder span { font-size: 1.75rem; display: block; margin-bottom: 0.5rem; color: var(--border); }
    .product-card.placeholder p { color: #b0c8c8; font-size: 0.85rem; }

    /* ── CONTACT ── */
    .contact { background: var(--sand); }

    .contact-inner {
      max-width: 640px;
    }

    .contact-email-block {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .contact-email-link {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--teal);
      text-decoration: none;
      border-bottom: 2px solid var(--pink);
      padding-bottom: 2px;
      transition: color 0.2s;
    }

    .contact-email-link:hover { color: var(--pink); }

    .contact-prep {
      background: var(--foam);
      border-left: 3px solid var(--teal);
      border-radius: 0 12px 12px 0;
      padding: 1.25rem 1.5rem;
    }

    .contact-prep p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .contact-prep p:last-child { margin-bottom: 0; }

    .contact-prep strong { color: var(--text); font-weight: 600; }

    .contact-prep ul {
      list-style: none;
      margin-top: 0.5rem;
    }

    .contact-prep ul li {
      font-size: 0.875rem;
      color: var(--muted);
      padding: 0.2rem 0 0.2rem 1.2rem;
      position: relative;
    }

    .contact-prep ul li::before {
      content: '·';
      position: absolute;
      left: 0;
      color: var(--pink);
      font-weight: 700;
    }

    /* ── ABOUT ── */
    .about { background: var(--white); }

    .about-inner {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 4rem;
      max-width: 960px;
      align-items: start;
    }

    .about-photo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 84px;
    }

    .about-photo {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--foam) 0%, #c8e8e8 100%);
      border: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }

    .about-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .about-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      color: var(--ink);
      text-align: center;
    }

    .about-role {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }

    .about-text p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
      margin-bottom: 1.25rem;
    }

    .about-text p:last-of-type { margin-bottom: 1.75rem; }

    .about-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .about-tag {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--teal);
      background: var(--foam);
      border: 1px solid var(--border);
      padding: 0.3rem 0.75rem;
      border-radius: 100px;
    }

    @media (max-width: 700px) {
      .about-inner {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .about-photo-wrap { position: static; flex-direction: row; align-items: center; gap: 1.25rem; }
      .about-photo { width: 80px; height: 80px; font-size: 0.6rem; }
      .about-name, .about-role { text-align: left; }
    }

    /* ── FOOTER ── */
    footer {
      padding: 2rem clamp(1.5rem, 5vw, 4rem);
      background: var(--ink);
      color: rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.85rem;
    }

    .footer-logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      color: var(--white);
      text-decoration: none;
    }

    .footer-logo span { color: var(--pink); }

    @media (max-width: 640px) {
      nav ul { display: none; }
      .hero { min-height: 80vh; }
    }
  </style>
</head>

    let currentLang = 'sv';

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === lang.toUpperCase());
      });

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const value = translations[lang][key];
        if (value !== undefined) el.innerHTML = value;
      });
    }

    // Init
    setLang('sv');
